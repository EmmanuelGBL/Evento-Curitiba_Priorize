# Config de produção da VPS emprestada (72.61.48.71). Mesmo padrão de
# Site/deploy/nginx.conf, um subdomínio a mais na mesma máquina.
#
# Instalar:
#   nginx.conf                    -> /etc/nginx/sites-available/evento-curitiba
#   evento-curitiba-headers.conf  -> /etc/nginx/sites-available/evento-curitiba-headers.conf
# e linkar só o primeiro em sites-enabled.
#
# Certificado, só para este subdomínio (não reaproveita o do site principal,
# porque é outro host):
#   certbot certonly --nginx --cert-name evento-curitiba \
#     -d inscricao.priorizecorporativa.com.br

upstream evento_curitiba {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name inscricao.priorizecorporativa.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inscricao.priorizecorporativa.com.br;

    ssl_certificate     /etc/letsencrypt/live/evento-curitiba/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evento-curitiba/privkey.pem;

    include /etc/nginx/sites-available/evento-curitiba-headers.conf;

    location / {
        proxy_pass http://evento_curitiba;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
