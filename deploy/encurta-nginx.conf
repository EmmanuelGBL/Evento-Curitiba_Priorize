# Subdominio dedicado ao encurtador de links da Priorize, servido pelo MESMO
# processo do evento-curitiba (porta 3002) — nao e um app novo, so mais um
# nome de host apontando pra ca. Ver src/app/[slug]/route.ts e
# src/app/api/links/route.ts. Passo a passo completo em deploy/encurta-links.md.
#
# Instalar:
#   encurta-nginx.conf -> /etc/nginx/sites-available/encurta-priorize
# e linkar so este em sites-enabled. Reaproveita o mesmo arquivo de headers
# do evento-curitiba (evento-curitiba-headers.conf ja precisa existir).

upstream encurta_priorize {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name encurta.priorizecorporativa.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name encurta.priorizecorporativa.com.br;

    ssl_certificate     /etc/letsencrypt/live/encurta-priorize/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/encurta-priorize/privkey.pem;

    include /etc/nginx/sites-available/evento-curitiba-headers.conf;

    location / {
        proxy_pass http://encurta_priorize;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
