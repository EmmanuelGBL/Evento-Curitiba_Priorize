# Mesmos cabeçalhos de Site/deploy/priorize-site-headers.conf.
#
# Sem X-Robots-Tag aqui também: o robots.txt/meta noindex já cuida da
# indexação (ver src/app/layout.tsx), e X-Robots-Tag via header é redundante.
#
# Sem Content-Security-Policy pelo mesmo motivo do site: um CSP errado
# quebra o envio do lead (fetch para /api/inscricao) sem erro visível na tela.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
